[build-system]
requires = ["hatchling >= 1.27"]
build-backend = "hatchling.build"

[project]
name = "kalamine"
version = "0.40"
description = "a cross-platform Keyboard Layout Maker"
readme = "README.rst"
authors = [{ name = "Fabien Cazenave", email = "fabien@cazenave.cc" }]
license = { text = "MIT License" }

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

requires-python = ">= 3.11"
dependencies = [
    "click>=8.0",
    "livereload",
    "pyyaml",
    "progress",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "lxml",
    "mypy>=1.13.0",
    "ruff>=0.8.0",
    "types-PyYAML",
    "twine>=5.1.1",
    "docutils>=0.22",
]

[project.urls]
Homepage = "https://github.com/OneDeadKey/kalamine"

[project.scripts]
kalamine = "kalamine.cli:cli"
xkalamine = "kalamine.cli_xkb:cli"
wkalamine = "kalamine.cli_msklc:cli"

[tool.ruff.lint]
extend-select = ["I"]

[tool.mypy]
ignore_missing_imports = true

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
kalamine = { path = ".", editable = true }

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }

# pixi cheat sheet for this repo (run from the repo root):
#   pixi run test           build layouts into dist/, then pytest
#   pixi run lint           ruff format --check, ruff check, mypy
#   pixi shell -e dev       activate the dev environment interactively
# Tasks live in the dev environment; plain `pixi run` finds them there.
# The "dev" feature name matches the identically named extra in
# [project.optional-dependencies], so mypy/ruff/twine/types-PyYAML/docutils
# come along for free.
[tool.pixi.feature.dev.dependencies]
pytest = ">=9.0.3,<10"
lxml = ">=6.1.1,<7"

[tool.pixi.feature.dev.tasks]
test = "kalamine build layouts/*.toml && pytest"
lint = "ruff format --check kalamine && ruff check kalamine && mypy kalamine"
